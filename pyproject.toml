[project]
name = "ic-factual"
version = "0.2.0"
description = "Reproduce paper figures on context vs memorization in language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14",
    "huggingface_hub>=0.26",
    "matplotlib>=3.7",
    "mistral-common>=1.8.6",
    "pandas>=1.5",
    "plotly>=5.18",
    "pycairo>=1.29.1",
    "scipy>=1.11",
    "torch>=2.3",
    "tqdm>=4.66",
    "transformers>=5.0",
    "wordfreq>=3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ic_factual"]
